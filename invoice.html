<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processed Invoices</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #007bff;
      color: white;
    }
    tr:hover {
      background: #f1f1f1;
    }
    .json-box {
      white-space: pre-wrap;
      background: #222;
      color: #0f0;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }
    button {
      padding: 8px 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <h1>Processed Invoice Data</h1>
  <table id="invoiceTable">
    <thead>
      <tr>
        <th>Filename</th>
        <th>Timestamp</th>
        <th>Total Amount</th>
        <th>Customer</th>
        <th>View JSON</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <pre class="json-box" id="jsonBox"></pre>

  <script>
    const apiUrl = "YOUR_GET_INVOICE_API_URL";

    async function loadInvoices() {
      const res = await fetch(apiUrl);
      const data = await res.json();

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.forEach(item => {
        const tr = document.createElement("tr");

        const total = item.structured_fields?.total_amount || "N/A";
        const customer = item.structured_fields?.customer_name || "N/A";

        tr.innerHTML = `
          <td>${item.filename}</td>
          <td>${item.timestamp}</td>
          <td>${total}</td>
          <td>${customer}</td>
          <td><button onclick='showJSON(${JSON.stringify(JSON.stringify(item))})'>View</button></td>
        `;

        tbody.appendChild(tr);
      });
    }

    function showJSON(text) {
      const box = document.getElementById("jsonBox");
      box.style.display = "block";
      box.textContent = JSON.parse(text);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    loadInvoices();
  </script>
</body>
</html>
